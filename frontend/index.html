<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Management System</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🎓 Student Management System</h1>
    <p>A CRUD web application &mdash; HTML, CSS, JavaScript &amp; Flask REST API</p>
  </header>

  <main class="container">
    <section class="form-card">
      <h2 id="form-title">Add Student</h2>
      <form id="student-form" novalidate>
        <input type="hidden" id="student-id" />

        <label for="name">Name</label>
        <input type="text" id="name" placeholder="e.g. Aditi Sharma" required />
        <span class="error" id="err-name"></span>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="e.g. aditi@example.com" required />
        <span class="error" id="err-email"></span>

        <label for="course">Course</label>
        <input type="text" id="course" placeholder="e.g. B.Tech CSE" required />
        <span class="error" id="err-course"></span>

        <label for="age">Age</label>
        <input type="number" id="age" placeholder="e.g. 20" required />
        <span class="error" id="err-age"></span>

        <div class="form-actions">
          <button type="submit" id="submit-btn">Add Student</button>
          <button type="button" id="cancel-btn" class="secondary hidden">Cancel</button>
        </div>
        <p class="status" id="form-status"></p>
      </form>
    </section>

    <section class="list-card">
      <div class="list-header">
        <h2>Students</h2>
        <input type="text" id="search" placeholder="Search by name, course, or email..." />
      </div>
      <table id="students-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Age</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="students-tbody">
          <tr><td colspan="6" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer class="app-footer">
    <p>SOP Compliant Mini Web Application &mdash; CRUD Demo</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
